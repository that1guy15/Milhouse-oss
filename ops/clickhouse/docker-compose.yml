# Loopback-only, authenticated reference ClickHouse for local Milhouse development (W04, plan 4.5 /
# 10.4, ADR 0005). It is NOT a production deployment and it is NOT started by `milhouse init`.
#
# Hardening:
#   * pinned to the ClickHouse 26.3 LTS reference line by exact image digest (25.8 is the
#     compatibility line);
#   * every published port is bound to 127.0.0.1 only — never reachable off the host;
#   * the application connects as a dedicated, non-empty credential supplied from the environment
#     (see .env.example); no secret is committed here;
#   * `CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=0` plus the mounted users.d config lock the built-in
#     `default` account, so there is no remotely usable or unauthenticated default user;
#   * a health check and resource guidance are provided.
#
# Copy .env.example to .env, set the credentials, then: `docker compose --env-file .env up -d`.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3@sha256:422be85ae7344058369cdd366ac0efea9daa8428b55c9cf50258e83a7d12fcb3
    container_name: milhouse-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: milhouse
      CLICKHOUSE_USER: ${MILHOUSE_CLICKHOUSE_APP_USER:?set a dedicated ClickHouse user in .env}
      CLICKHOUSE_PASSWORD: ${MILHOUSE_CLICKHOUSE_APP_PASSWORD:?set a non-empty ClickHouse password in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./users.d:/etc/clickhouse-server/users.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          # Guidance only (honored by the compose spec); size to the host.
          memory: 4g
    healthcheck:
      test:
        - "CMD"
        - "clickhouse-client"
        - "--user"
        - "${MILHOUSE_CLICKHOUSE_APP_USER}"
        - "--password"
        - "${MILHOUSE_CLICKHOUSE_APP_PASSWORD}"
        - "--query"
        - "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  clickhouse-data:
